name: Replay the corpus comparison

# A reusable workflow: anyone can repeat the recorded comparison in their own
# repository's Actions with a few lines (see REPRODUCE.md). It checks out this
# repository, wexp-ref and wexp-vectors at exact commits, runs the unit tests
# and the corpus comparison against the recorded baseline, and keeps the
# comparison file as an artifact of the caller's run.
#
# It needs no secret and no permission beyond reading public repositories. It
# also runs here on pull requests that change it, so the published workflow is
# the one that is tested.

on:
  workflow_call:
    inputs:
      wexp_check_commit:
        description: 'Commit of WEXP-dev/wexp-check to replay'
        type: string
        default: 63bde685c54fd6329f1217708d1c211b80c3712e
      wexp_ref_commit:
        description: 'Commit of WEXP-dev/wexp-ref to compare with'
        type: string
        default: 56289024c9ee748111f1f1d4f42728ffe04d8d69
      wexp_vectors_commit:
        description: 'Commit of WEXP-dev/wexp-vectors holding the corpora'
        type: string
        default: edd67056873502a2c3cecf5dd2b8db71271c2f57
      python-version:
        type: string
        default: '3.12'
  pull_request:
    paths:
      - '.github/workflows/replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: replay at pinned revisions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      WEXP_CHECK_COMMIT: ${{ inputs.wexp_check_commit || '63bde685c54fd6329f1217708d1c211b80c3712e' }}
      WEXP_REF_COMMIT: ${{ inputs.wexp_ref_commit || '56289024c9ee748111f1f1d4f42728ffe04d8d69' }}
      WEXP_VECTORS_COMMIT: ${{ inputs.wexp_vectors_commit || 'edd67056873502a2c3cecf5dd2b8db71271c2f57' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python-version || '3.12' }}
      - name: Check out the three repositories at exact commits
        run: |
          set -euo pipefail
          for pair in "wexp-check:$WEXP_CHECK_COMMIT" "wexp-ref:$WEXP_REF_COMMIT" "wexp-vectors:$WEXP_VECTORS_COMMIT"; do
            name="${pair%%:*}"; commit="${pair##*:}"
            case "$commit" in
              *[!0-9a-f]*|'') echo "::error::$name: a full commit id is required"; exit 1 ;;
            esac
            [ "${#commit}" -eq 40 ] || { echo "::error::$name: a full commit id is required"; exit 1; }
            git clone --quiet "https://github.com/WEXP-dev/$name.git" "$RUNNER_TEMP/$name"
            git -C "$RUNNER_TEMP/$name" checkout --quiet "$commit"
          done
      - name: Unit tests
        working-directory: ${{ runner.temp }}/wexp-check
        run: PYTHONPATH=. python -B -m unittest discover -s tests
      - name: Corpus comparison against the recorded baseline
        working-directory: ${{ runner.temp }}/wexp-check
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/replay"
          python -B scripts/compare_corpora.py --baseline comparison.json . \
            "$RUNNER_TEMP/wexp-ref" "$RUNNER_TEMP/replay/comparison.json" \
            "$RUNNER_TEMP/wexp-vectors/vectors/WEXP-CORE-02-VECTORS-001/corpus.json" \
            "$RUNNER_TEMP/wexp-vectors/vectors/WEXP-CORE-02-VECTORS-002/corpus.json" | tee "$RUNNER_TEMP/replay/output.txt"
          {
            echo "### Replay of the wexp-check corpus comparison"
            echo
            echo "wexp-check \`$WEXP_CHECK_COMMIT\`, wexp-ref \`$WEXP_REF_COMMIT\`, wexp-vectors \`$WEXP_VECTORS_COMMIT\`, $(python --version)."
            echo
            echo '```'
            grep -E '^WEXP-CORE-02-VECTORS-' "$RUNNER_TEMP/replay/output.txt"
            echo '```'
            echo
            echo "This repeats the recorded comparison with the published code on the published inputs. It is not an independent implementation, and it does not make the two appraisers independent of each other."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the comparison file
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wexp-check-replay
          path: ${{ runner.temp }}/replay/
          if-no-files-found: warn
          retention-days: 30
